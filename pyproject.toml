[project]
name = "docx-chat-editor"
version = "0.1.0"
description = "聊天式 Word 文档自动排版工具：LLM 把自然语言指令翻译成结构化操作，python-docx 执行修改"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "python-docx>=1.1",
    "anthropic>=0.40",
    "python-multipart>=0.0.9",
    "pydantic>=2.6",
    "pypdf>=4.0",
    "pymupdf>=1.23",
    "rapidocr_onnxruntime>=1.3",
    "httpx>=0.27",
    "python-dotenv>=1.0",
]

# 运行依赖以 requirements.txt 为安装入口（README 用 pip install -r）；
# 此处镜像一份用于工具识别，二者请保持一致。

[tool.setuptools]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
