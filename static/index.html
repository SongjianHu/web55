<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Docx Chat Editor</title>
<script src="https://cdn.jsdelivr.net/npm/jszip/dist/jszip.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/docx-preview/dist/docx-preview.min.js"></script>
<style>
/* ============================================================
   Design tokens — 米白透明玻璃风
   ============================================================ */
:root {
  --bg:        #ece6db;

  --glass-0:   rgba(253, 249, 242, 0.55);
  --glass-1:   rgba(253, 249, 242, 0.78);
  --glass-2:   rgba(254, 251, 245, 0.94);

  --bdr-0:     rgba(195, 182, 158, 0.28);
  --bdr-1:     rgba(195, 182, 158, 0.48);
  --bdr-2:     rgba(170, 155, 130, 0.65);

  --text-1:    #24201b;
  --text-2:    #5c5048;
  --text-3:    #978170;

  --accent:       #6c4ef3;
  --accent-2:     #8b6fff;
  --accent-dim:   rgba(108, 78, 243, 0.10);
  --accent-hover: #5a3de8;

  --err-bg:  rgba(254, 238, 235, 0.92);
  --err-bdr: rgba(230, 100, 80,  0.25);

  --shadow-xs: 0 1px 3px  rgba(50,38,22,0.07);
  --shadow-sm: 0 2px 10px rgba(50,38,22,0.08);
  --shadow-md: 0 6px 24px rgba(50,38,22,0.10);
  --shadow-lg: 0 14px 52px rgba(50,38,22,0.14);

  --r-sm:  8px;  --r-md: 12px; --r-lg: 16px;
  --r-xl: 20px;  --r-pill: 9999px;

  --blur-sm: blur(10px);
  --blur-md: blur(20px);

  --font-sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC',
               'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
  --font-mono: ui-monospace, 'JetBrains Mono', 'Fira Code', 'Cascadia Code', monospace;
}

/* ============================================================
   Reset & base
   ============================================================ */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; overflow: hidden; }

body {
  font-family: var(--font-sans);
  font-size: 14px;
  color: var(--text-1);
  display: flex;
  flex-direction: column;
  /* 米白暖调背景，带环境光渐变 */
  background-color: var(--bg);
  background-image:
    radial-gradient(ellipse 75% 60% at 15% 85%, rgba(160,130,220,0.18) 0%, transparent 65%),
    radial-gradient(ellipse 60% 55% at 85% 15%, rgba(220,180,110,0.18) 0%, transparent 65%),
    radial-gradient(ellipse 90% 70% at 50% 50%, rgba(255,240,200,0.12) 0%, transparent 75%);
  background-attachment: fixed;
}

/* ============================================================
   Header
   ============================================================ */
.app-header {
  flex-shrink: 0;
  height: 52px;
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 0 20px;
  background: var(--glass-2);
  backdrop-filter: var(--blur-md);
  -webkit-backdrop-filter: var(--blur-md);
  border-bottom: 1px solid var(--bdr-1);
  box-shadow: var(--shadow-sm);
  z-index: 100;
}

.header-logo { display: flex; align-items: center; gap: 9px; }

.header-icon {
  width: 29px; height: 29px;
  background: var(--accent);
  border-radius: var(--r-sm);
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 2px 8px rgba(108,78,243,0.38);
  flex-shrink: 0;
}
.header-icon svg { width: 15px; height: 15px; stroke: white; fill: none; }

.header-title {
  font-size: 14px;
  font-weight: 600;
  letter-spacing: -0.01em;
  color: var(--text-1);
}

.header-sep {
  width: 1px; height: 18px;
  background: var(--bdr-1);
  margin: 0 2px;
}

.header-status {
  display: flex; align-items: center; gap: 6px;
  font-size: 12px; color: var(--text-3);
}
.status-dot {
  width: 6px; height: 6px; border-radius: 50%;
  background: var(--bdr-2); flex-shrink: 0;
  transition: background 0.3s, box-shadow 0.3s;
}
.status-dot.active {
  background: #55c48a;
  box-shadow: 0 0 0 3px rgba(85,196,138,0.22);
}

/* ============================================================
   Two-pane layout
   ============================================================ */
.main { flex: 1; display: flex; overflow: hidden; }

/* ============================================================
   Left panel
   ============================================================ */
.left-panel {
  width: 400px;
  flex-shrink: 0;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  background: var(--glass-0);
  backdrop-filter: var(--blur-md);
  -webkit-backdrop-filter: var(--blur-md);
  border-right: 1px solid var(--bdr-1);
}

/* ── Upload zone ── */
.upload-zone {
  margin: 14px 14px 0;
  border: 1.5px dashed var(--bdr-2);
  border-radius: var(--r-lg);
  padding: 22px 16px 20px;
  text-align: center;
  cursor: pointer;
  position: relative;
  overflow: hidden;
  flex-shrink: 0;
  transition: border-color 0.18s, box-shadow 0.18s;
}
.upload-zone::after {
  content: '';
  position: absolute; inset: 0;
  border-radius: calc(var(--r-lg) - 1.5px);
  background: var(--accent-dim);
  opacity: 0;
  transition: opacity 0.18s;
}
.upload-zone:hover,
.upload-zone.drag-over {
  border-color: var(--accent);
  border-style: solid;
  box-shadow: 0 0 0 3px var(--accent-dim);
}
.upload-zone:hover::after,
.upload-zone.drag-over::after { opacity: 1; }
.upload-zone input { display: none; }

.upload-icon {
  width: 42px; height: 42px;
  margin: 0 auto 10px;
  background: rgba(108,78,243,0.09);
  border-radius: var(--r-md);
  display: flex; align-items: center; justify-content: center;
  position: relative; z-index: 1;
}
.upload-icon svg { width: 21px; height: 21px; stroke: var(--accent); fill: none; }
.upload-title {
  font-size: 13px; font-weight: 500; color: var(--text-2);
  position: relative; z-index: 1;
}
.upload-hint {
  font-size: 11.5px; color: var(--text-3); margin-top: 3px;
  position: relative; z-index: 1;
}

/* ── Toolbar ── */
.toolbar {
  display: flex; align-items: center; gap: 6px;
  padding: 10px 14px;
  border-bottom: 1px solid var(--bdr-0);
  flex-shrink: 0;
}

.btn {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 5px 11px;
  border-radius: var(--r-sm);
  font-size: 12px; font-weight: 500;
  font-family: inherit; cursor: pointer;
  white-space: nowrap; line-height: 1;
  transition: all 0.15s ease;
  border: 1px solid transparent;
}
.btn:disabled { opacity: 0.40; cursor: not-allowed; pointer-events: none; }
.btn svg {
  width: 15px; height: 15px;
  flex-shrink: 0;
  fill: none;
  stroke: currentColor;
  stroke-width: 2.2;
  stroke-linecap: round;
  stroke-linejoin: round;
}

.btn-primary {
  background: var(--accent); color: white;
  box-shadow: 0 1px 5px rgba(108,78,243,0.32);
}
.btn-primary:hover:not(:disabled) {
  background: var(--accent-hover);
  box-shadow: 0 3px 10px rgba(108,78,243,0.40);
  transform: translateY(-1px);
}
.btn-primary:active:not(:disabled) { transform: none; }

.btn-ghost {
  background: rgba(255,252,245,0.55);
  color: var(--text-2); border-color: var(--bdr-1);
}
.btn-ghost:hover:not(:disabled) {
  background: rgba(255,252,245,0.90);
  color: var(--text-1); border-color: var(--bdr-2);
}

.btn-thesis {
  background: linear-gradient(135deg, #1a9e6e 0%, #22c587 100%);
  color: white;
  box-shadow: 0 1px 5px rgba(26,158,110,0.32);
}
.btn-thesis:hover:not(:disabled) {
  background: linear-gradient(135deg, #158a5f 0%, #1aaf78 100%);
  box-shadow: 0 3px 10px rgba(26,158,110,0.44);
  transform: translateY(-1px);
}
.btn-thesis:active:not(:disabled) { transform: none; }

/* ── Chat ── */
.chat {
  flex: 1; overflow-y: auto;
  padding: 14px 14px;
  display: flex; flex-direction: column; gap: 10px;
}
.chat::-webkit-scrollbar { width: 4px; }
.chat::-webkit-scrollbar-track { background: transparent; }
.chat::-webkit-scrollbar-thumb { background: var(--bdr-2); border-radius: var(--r-pill); }

.msg {
  display: flex;
  animation: fadeUp 0.20s ease forwards;
}
.msg.user { justify-content: flex-end; }
.msg.bot  { justify-content: flex-start; }

@keyframes fadeUp {
  from { opacity: 0; transform: translateY(6px); }
  to   { opacity: 1; transform: translateY(0); }
}

.bubble {
  max-width: 84%;
  padding: 9px 13px;
  border-radius: var(--r-lg);
  font-size: 13px; line-height: 1.55;
  word-wrap: break-word; white-space: pre-wrap;
}
.msg.user .bubble {
  background: linear-gradient(145deg, var(--accent) 0%, var(--accent-2) 100%);
  color: white;
  border-bottom-right-radius: 4px;
  box-shadow: 0 2px 14px rgba(108,78,243,0.28);
}
.msg.bot .bubble {
  background: var(--glass-2);
  backdrop-filter: var(--blur-sm);
  -webkit-backdrop-filter: var(--blur-sm);
  border: 1px solid var(--bdr-1);
  color: var(--text-1);
  border-bottom-left-radius: 4px;
  box-shadow: var(--shadow-xs);
}
.msg.err .bubble {
  background: var(--err-bg);
  backdrop-filter: var(--blur-sm);
  -webkit-backdrop-filter: var(--blur-sm);
  border: 1px solid var(--err-bdr);
  color: #b83c2a;
  border-radius: var(--r-md);
}

.ops {
  margin-top: 8px; padding: 8px 10px;
  background: rgba(232, 225, 212, 0.72);
  border: 1px solid var(--bdr-0);
  border-radius: var(--r-sm);
  font-family: var(--font-mono);
  font-size: 10.5px; line-height: 1.55;
  color: var(--text-2);
  white-space: pre-wrap;
  max-height: 150px; overflow-y: auto;
}
.ops::-webkit-scrollbar { width: 3px; }
.ops::-webkit-scrollbar-thumb { background: var(--bdr-2); border-radius: var(--r-pill); }

/* ============================================================
   批量排版 Modal
   ============================================================ */
.batch-overlay {
  position: fixed; inset: 0;
  background: rgba(36, 32, 27, 0.42);
  backdrop-filter: blur(4px);
  -webkit-backdrop-filter: blur(4px);
  z-index: 1000;
  display: flex; align-items: center; justify-content: center;
  animation: batchFade 0.18s ease forwards;
}
/* HTML `hidden` 属性的 display:none 优先级低于 .batch-overlay 的 display:flex，
   不显式覆盖会导致 modal 默认在页面打开时就显示，遮住整个上传区。 */
.batch-overlay[hidden] { display: none !important; }
@keyframes batchFade { from { opacity: 0; } to { opacity: 1; } }

.batch-card {
  width: min(560px, 92vw);
  max-height: 86vh;
  display: flex; flex-direction: column;
  background: var(--glass-2);
  backdrop-filter: var(--blur-md);
  -webkit-backdrop-filter: var(--blur-md);
  border: 1px solid var(--bdr-1);
  border-radius: var(--r-lg);
  box-shadow: var(--shadow-lg);
  overflow: hidden;
}
.batch-head {
  display: flex; align-items: center; gap: 8px;
  padding: 14px 18px;
  border-bottom: 1px solid var(--bdr-0);
}
.batch-head h3 {
  font-size: 15px; font-weight: 600;
  color: var(--text-1);
  flex: 1;
  letter-spacing: -0.01em;
}
.batch-close {
  width: 26px; height: 26px;
  display: inline-flex; align-items: center; justify-content: center;
  border: 1px solid var(--bdr-1);
  border-radius: var(--r-sm);
  background: rgba(255,252,245,0.55);
  color: var(--text-2);
  font-size: 16px; line-height: 1;
  cursor: pointer;
  transition: all 0.12s;
}
.batch-close:hover { background: rgba(255,252,245,0.95); color: var(--text-1); }

.batch-body {
  padding: 14px 18px;
  overflow-y: auto;
  flex: 1;
}
.batch-body::-webkit-scrollbar { width: 4px; }
.batch-body::-webkit-scrollbar-thumb { background: var(--bdr-2); border-radius: var(--r-pill); }

.batch-drop {
  position: relative;
  display: block;
  border: 1.5px dashed var(--bdr-2);
  border-radius: var(--r-md);
  padding: 22px 14px;
  text-align: center;
  cursor: pointer;
  font-size: 12.5px; color: var(--text-2);
  background: rgba(255,252,245,0.32);
  transition: border-color 0.15s ease, background 0.15s ease, box-shadow 0.15s ease;
  user-select: none;
}
.batch-drop:hover {
  border-color: var(--accent);
  background: rgba(108,78,243,0.06);
  box-shadow: 0 0 0 3px var(--accent-dim);
}
.batch-drop.drag-over {
  border-style: solid;
  border-color: var(--accent);
  background: var(--accent-dim);
  box-shadow: 0 0 0 4px rgba(108,78,243,0.18);
}
.batch-drop strong { color: var(--accent); }

.batch-filelist {
  margin-top: 10px;
  border: 1px solid var(--bdr-0);
  border-radius: var(--r-sm);
  background: rgba(255,252,245,0.42);
  max-height: 140px;
  overflow-y: auto;
}
.batch-filelist:empty { display: none; }
.batch-filelist::-webkit-scrollbar { width: 3px; }
.batch-filelist::-webkit-scrollbar-thumb { background: var(--bdr-2); border-radius: var(--r-pill); }

.batch-file-row {
  display: flex; align-items: center; gap: 8px;
  padding: 5px 10px;
  font-size: 12px;
  color: var(--text-1);
  border-bottom: 1px solid var(--bdr-0);
}
.batch-file-row:last-child { border-bottom: none; }
.batch-file-row .name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.batch-file-row .size { color: var(--text-3); font-size: 11px; }
.batch-file-row .remove {
  border: none; background: transparent;
  color: var(--text-3); cursor: pointer;
  font-size: 14px; padding: 0 2px;
}
.batch-file-row .remove:hover { color: #b83c2a; }

.batch-section-title {
  font-size: 11px; font-weight: 600;
  color: var(--text-3);
  letter-spacing: 0.04em;
  margin: 14px 0 5px;
  text-transform: uppercase;
}

.batch-defaults-summary {
  padding: 8px 12px;
  border-radius: var(--r-sm);
  background: var(--accent-dim);
  font-size: 12px; color: var(--text-2);
  display: flex; align-items: center; gap: 8px;
}
.batch-defaults-summary strong { color: var(--accent); font-weight: 600; }

.batch-msg-input {
  width: 100%;
  resize: none;
  min-height: 60px; max-height: 200px;
  padding: 9px 11px;
  font: inherit; font-size: 12.5px; line-height: 1.5;
  color: var(--text-1);
  background: rgba(255,252,245,0.62);
  border: 1px solid var(--bdr-1);
  border-radius: var(--r-sm);
  outline: none;
  transition: border-color 0.15s, box-shadow 0.15s;
}
.batch-msg-input:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px var(--accent-dim);
}

.batch-foot {
  display: flex; gap: 8px;
  padding: 12px 18px;
  border-top: 1px solid var(--bdr-0);
  background: rgba(255,252,245,0.40);
}
.batch-foot .spacer { flex: 1; }

.batch-results {
  margin-top: 14px;
  padding: 8px 0;
  border-top: 1px dashed var(--bdr-0);
}
.batch-result-row {
  display: flex; align-items: center; gap: 8px;
  padding: 5px 4px;
  font-size: 12.5px;
  border-bottom: 1px solid rgba(195,182,158,0.18);
}
.batch-result-row:last-child { border-bottom: none; }
.batch-result-row .icon {
  width: 18px; height: 18px;
  display: inline-flex; align-items: center; justify-content: center;
  border-radius: 50%;
  font-size: 11px; font-weight: 700;
  flex-shrink: 0;
}
.batch-result-row.ok   .icon { background: rgba(85,196,138,0.22);  color: #2c8b57; }
.batch-result-row.err  .icon { background: rgba(230,100,80,0.22);  color: #b83c2a; }
.batch-result-row .name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.batch-result-row .meta { color: var(--text-3); font-size: 11px; }
.batch-result-row .err-msg { color: #b83c2a; font-size: 11px; flex-basis: 100%; padding-left: 26px; }

.batch-progress {
  display: flex; align-items: center; gap: 10px;
  padding: 12px;
  color: var(--text-2);
  font-size: 12.5px;
}

/* ============================================================
   默认排版面板
   ============================================================ */
.defaults-panel {
  margin: 0 14px;
  border: 1px solid var(--bdr-1);
  border-radius: var(--r-md);
  background: var(--glass-1);
  backdrop-filter: var(--blur-sm);
  -webkit-backdrop-filter: var(--blur-sm);
  overflow: hidden;
  flex-shrink: 0;
}
.defaults-panel summary {
  padding: 9px 14px;
  display: flex; align-items: center; gap: 8px;
  cursor: pointer; user-select: none;
  list-style: none;
  font-size: 12.5px; font-weight: 500;
  color: var(--text-2);
}
.defaults-panel summary::-webkit-details-marker { display: none; }
.defaults-panel summary::before {
  content: '▸';
  font-size: 10px;
  transition: transform 0.18s;
  color: var(--text-3);
}
.defaults-panel[open] summary::before { transform: rotate(90deg); }
.defaults-panel summary:hover { background: rgba(255,252,245,0.50); }

.defaults-summary-tag {
  margin-left: auto;
  padding: 2px 8px;
  font-size: 10.5px; font-weight: 500;
  color: var(--accent);
  background: var(--accent-dim);
  border-radius: var(--r-pill);
}

.defaults-body {
  padding: 8px 14px 12px;
  border-top: 1px dashed var(--bdr-0);
  max-height: 320px; overflow-y: auto;
}
.defaults-body::-webkit-scrollbar { width: 4px; }
.defaults-body::-webkit-scrollbar-thumb { background: var(--bdr-2); border-radius: var(--r-pill); }

.defaults-cat {
  margin-top: 8px;
}
.defaults-cat:first-child { margin-top: 0; }
.defaults-cat-title {
  font-size: 11px; font-weight: 600;
  color: var(--text-3);
  letter-spacing: 0.04em;
  margin-bottom: 4px;
  text-transform: uppercase;
}
.defaults-row {
  position: relative;
  display: flex; align-items: center; gap: 7px;
  padding: 5px 6px;
  border-radius: var(--r-sm);
  font-size: 12.5px;
  color: var(--text-1);
  cursor: pointer;
  transition: background 0.12s;
}
.defaults-row:hover { background: rgba(255,252,245,0.55); }
.defaults-row input[type="checkbox"] {
  flex-shrink: 0;
  width: 14px; height: 14px;
  accent-color: var(--accent);
  cursor: pointer;
}
.defaults-row-name { flex: 1; }
.defaults-row-info {
  width: 16px; height: 16px;
  border-radius: 50%;
  display: inline-flex; align-items: center; justify-content: center;
  font-size: 9px; font-weight: 700;
  color: var(--text-3);
  background: rgba(195,182,158,0.22);
  cursor: help;
}

/* Tooltip on hover */
.defaults-row .tip {
  position: absolute;
  z-index: 50;
  bottom: calc(100% + 4px);
  left: 14px; right: 14px;
  padding: 8px 10px;
  background: rgba(36, 32, 27, 0.93);
  color: #f6efe2;
  font-size: 11.5px; line-height: 1.55;
  border-radius: var(--r-sm);
  box-shadow: var(--shadow-md);
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.12s;
  white-space: normal;
}
.defaults-row:hover .tip { opacity: 1; }

.defaults-actions {
  display: flex; gap: 6px;
  margin-top: 10px;
  padding-top: 8px;
  border-top: 1px dashed var(--bdr-0);
}
.defaults-actions .btn { font-size: 11.5px; padding: 5px 10px; }

/* ============================================================
   论文结构面板
   ============================================================ */
.structure-panel {
  margin: 0 14px;
  border: 1px solid var(--bdr-1);
  border-radius: var(--r-md);
  background: var(--glass-1);
  backdrop-filter: var(--blur-sm);
  -webkit-backdrop-filter: var(--blur-sm);
  overflow: hidden;
  flex-shrink: 0;
}
.structure-panel summary {
  padding: 9px 14px;
  display: flex; align-items: center; gap: 8px;
  cursor: pointer; user-select: none;
  list-style: none;
  font-size: 12.5px; font-weight: 500;
  color: var(--text-2);
}
.structure-panel summary::-webkit-details-marker { display: none; }
.structure-panel summary::before {
  content: '▸';
  font-size: 10px;
  transition: transform 0.18s;
  color: var(--text-3);
}
.structure-panel[open] summary::before { transform: rotate(90deg); }
.structure-panel summary:hover { background: rgba(255,252,245,0.50); }
.structure-summary-tag {
  margin-left: auto;
  padding: 2px 8px;
  font-size: 10.5px; font-weight: 500;
  color: #0f766e;
  background: rgba(20,184,166,0.12);
  border-radius: var(--r-pill);
}
.structure-body {
  padding: 8px 14px 12px;
  border-top: 1px dashed var(--bdr-0);
  max-height: 340px; overflow-y: auto;
}
.structure-body::-webkit-scrollbar { width: 4px; }
.structure-body::-webkit-scrollbar-thumb { background: var(--bdr-2); border-radius: var(--r-pill); }
.structure-item {
  display: flex; align-items: baseline; gap: 6px;
  padding: 3px 4px;
  border-radius: var(--r-sm);
  line-height: 1.5;
}

/* 蒸馏的排版要求清单（长文本两阶段管线产出）*/

<script>
const $ = (id) => document.getElementById(id);
let sessionId    = null;
let historyCount = 0;

const setStatus        = (t) => { $('status').textContent = t; };
const setPreviewStatus = (t) => { $('previewStatus').textContent = t; };

function syncUndoBtn() {
  $('undoBtn').disabled = !sessionId || historyCount === 0;
}

// ===== 消息气泡 =====

function addMsg(role, text, ops) {
  const wrap = document.createElement('div');
  wrap.className = `msg ${role}`;
  const bubble = document.createElement('div');
  bubble.className = 'bubble';

  // 用户气泡过长时折叠：避免一次粘贴上万字的格式要求把聊天区淹没
  if (role === 'user' && text && text.length > 400) {
    const head = document.createElement('div');
    head.textContent = `📄 已发送 ${text.length} 字格式要求`;
    const det = document.createElement('details');
    det.className = 'distilled';
    det.style.marginTop = '6px';
    const sum = document.createElement('summary');
    sum.textContent = '查看原文';
    const body = document.createElement('div');
    body.className = 'distilled-body';
    body.style.background = 'rgba(255,255,255,0.18)';
    body.textContent = text;
    det.appendChild(sum); det.appendChild(body);
    bubble.appendChild(head);
    bubble.appendChild(det);
  } else {
    bubble.textContent = text;
  }

  if (ops) {
    const pre = document.createElement('div');
    pre.className = 'ops';
    pre.textContent = JSON.stringify(ops, null, 2);
    bubble.appendChild(pre);
  }
  wrap.appendChild(bubble);
  $('chat').appendChild(wrap);
  $('chat').scrollTop = $('chat').scrollHeight;
  return bubble;
}

function addError(text) {
  const wrap = document.createElement('div');
  wrap.className = 'msg bot err';
  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  bubble.textContent = '❌ ' + text;
  wrap.appendChild(bubble);
  $('chat').appendChild(wrap);
  $('chat').scrollTop = $('chat').scrollHeight;
}

// ===== 上传 =====

async function uploadFile(file) {
  if (!file.name.toLowerCase().endsWith('.docx')) {
    addError('只支持 .docx 文件');
    return;
  }
  const fd = new FormData();
  fd.append('file', file);
  setStatus('上传中…');
  try {

const inputEl = $('input');
function autoResize() {
  inputEl.style.height = 'auto';
  inputEl.style.height = Math.min(inputEl.scrollHeight, 320) + 'px';
}
inputEl.addEventListener('input', autoResize);

// 在光标位置插入文字（替换选区，并把光标移到插入末尾）
function insertAtCursor(text) {
  const start = inputEl.selectionStart ?? inputEl.value.length;
  const end   = inputEl.selectionEnd   ?? inputEl.value.length;
  const before = inputEl.value.slice(0, start);
  const after  = inputEl.value.slice(end);
  inputEl.value = before + text + after;
  const pos = start + text.length;
  inputEl.focus();
  inputEl.setSelectionRange(pos, pos);
  autoResize();
}

const composerHint = $('composerHint');
function showHint(text, live = false, ms = 2400) {
  composerHint.textContent = text;
  composerHint.classList.toggle('live', live);
  if (ms > 0) {
    clearTimeout(showHint._t);
    showHint._t = setTimeout(() => {
      if (composerHint.textContent === text) composerHint.textContent = '';
      composerHint.classList.remove('live');
    }, ms);
  }
}

  if (!['pdf', 'docx', 'txt'].includes(ext)) {

    return;

// ===== 语音输入（持续监听，再按一次停止）=====

const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let recognition = null;
let recAnchorPos = 0;       // 录音开始时的光标位置
let recBaseValue = '';      // 录音开始前输入框已有内容
let recFinalText = '';      // 已确认（final）的转写片段拼接

if (SR) {
  recognition = new SR();
  recognition.lang = 'zh-CN';
  recognition.continuous = true;
  recognition.interimResults = true;

  recognition.onresult = (event) => {
    let interim = '';
    for (let i = event.resultIndex; i < event.results.length; i++) {
      const r = event.results[i];
      if (r.isFinal) recFinalText += r[0].transcript;
      else           interim += r[0].transcript;
    }
    const insert = recFinalText + interim;
    inputEl.value =
      recBaseValue.slice(0, recAnchorPos) + insert + recBaseValue.slice(recAnchorPos);
    const caret = recAnchorPos + insert.length;
    inputEl.setSelectionRange(caret, caret);
    autoResize();
    showHint(interim ? '识别中…' : `已录入 ${recFinalText.length} 字`, true, 0);
  };

  recognition.onerror = (e) => {
    addError(`语音识别错误：${e.error || '未知错误'}`);
    stopVoice();
  };

  recognition.onend = () => {
    // 用户主动停止 / 浏览器超时结束 → 同步 UI
    stopVoice(true);
  };
}

function startVoice() {
  if (!recognition) {
    addError('当前浏览器不支持语音识别（建议使用 Chrome / Edge）');
    return;
  }
  recAnchorPos  = inputEl.selectionStart ?? inputEl.value.length;
  recBaseValue  = inputEl.value;
  recFinalText  = '';
  try {
    recognition.start();
  } catch (err) {
    // 已在录音中再次 start 会抛错，忽略
    return;
  }
  $('voiceBtn').classList.add('recording');
  $('voiceBtn').title = '停止录音';
  showHint('🎙 正在录音…', true, 0);
}

function stopVoice(silent = false) {
  if (!recognition) return;
  $('voiceBtn').classList.remove('recording');
  $('voiceBtn').title = '语音输入（点击开始/停止）';
  try {
    if (!silent) recognition.stop();
  } catch (err) { /* ignore */ }
  if (recFinalText) {
    showHint(`已录入 ${recFinalText.length} 字`);
  } else {
    showHint('');
  }
}

$('voiceBtn').addEventListener('click', () => {
  if ($('voiceBtn').classList.contains('recording')) {
    stopVoice();
  } else {
    startVoice();
  }
});

if (!SR) {

}

async function loadStructure() {
  if (!sessionId) return;

function renderStructure(data) {
  const body  = $('structureBody');
  const items = data.items || [];
  const stats = data.stats || {};

  if (!items.length) {
    body.innerHTML = '<div style="text-align:center;color:var(--text-3);padding:12px 0;font-size:12px;">未识别到结构元素</div>';
    $('structureTag').textContent = '未识别';
    return;
  }

  const mainItems = items.filter(x => !INLINE_TYPES.has(x.type));
  let html = '';
  for (const item of mainItems) {
    const cfg    = STRUCTURE_BADGE_CFG[item.type] || { label: item.label, color:'#64748b', bg:'rgba(100,116,139,0.10)' };
    const indent = STRUCTURE_INDENT[item.type] || 0;
    const text   = item.text.length > 44 ? item.text.slice(0, 42) + '…' : item.text;
    html += `<div class="structure-item" style="padding-left:${4 + indent}px">
      <span class="structure-badge" style="color:${cfg.color};background:${cfg.bg}">${escapeHtml(cfg.label)}</span>
      <span class="structure-text">${escapeHtml(text)}</span>
    </div>`;
  }

  const statParts = [];
  if (stats.figures)   statParts.push(`图 ${stats.figures} 个`);
  if (stats.tables)    statParts.push(`表 ${stats.tables} 个`);
  if (stats.equations) statParts.push(`公式 ${stats.equations} 个`);
  if (statParts.length) {
    html += '<div class="structure-stats">' +
      statParts.map(s => `<span class="structure-stat">${escapeHtml(s)}</span>`).join('') +
      '</div>';
  }

  body.innerHTML = html;
  $('structureTag').textContent = `${items.length} 项`;
  $('structurePanel').open = true;
}

let defaultsList = [];   // [{id, name, category, description, preselected}]

function escapeHtml(s) {
  return s.replace(/[&<>"']/g, c =>
    ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

async function loadDefaults() {
  try {
    const r = await fetch('/defaults');
    if (!r.ok) throw new Error(await r.text());
    const data = await r.json();
    defaultsList = data.defaults || [];
    renderDefaults();
  } catch (err) {
    $('defaultsBody').innerHTML =
      `<div style="color:#b83c2a; font-size:12px;">加载失败：${escapeHtml(err.message)}</div>`;
  }
}

function renderDefaults() {
  const groups = {};
  for (const d of defaultsList) {
    (groups[d.category] = groups[d.category] || []).push(d);
  }
  // 类目展示顺序，与后端 CATEGORY_ORDER 一致
  const catOrder = ['页面','字体','标题','节专属','题注','表格','页眉页脚','编号'];
  const cats = catOrder.filter(c => groups[c]).concat(
    Object.keys(groups).filter(c => !catOrder.includes(c)));

  let html = '';
  for (const cat of cats) {
    html += `<div class="defaults-cat"><div class="defaults-cat-title">${escapeHtml(cat)}</div>`;
    for (const d of groups[cat]) {
      const checked = d.preselected ? 'checked' : '';
      html += `
        <label class="defaults-row" data-id="${d.id}">
          <input type="checkbox" ${checked} value="${d.id}">
          <span class="defaults-row-name">${escapeHtml(d.name)}</span>
          <span class="defaults-row-info">i</span>
          <span class="tip">${escapeHtml(d.description)}</span>
        </label>`;
    }
    html += `</div>`;
  }
  html += `
    <div class="defaults-actions">
      <button class="btn btn-primary" id="applyDefaultsBtn" disabled>应用所选</button>
      <button class="btn btn-ghost" id="defaultsSelectAll">全选</button>
      <button class="btn btn-ghost" id="defaultsSelectNone">全不选</button>
    </div>`;

  $('defaultsBody').innerHTML = html;
  updateDefaultsCount();

  $('applyDefaultsBtn').addEventListener('click', applyDefaults);
  $('defaultsSelectAll').addEventListener('click', () => toggleAllDefaults(true));
  $('defaultsSelectNone').addEventListener('click', () => toggleAllDefaults(false));
  $('defaultsBody').addEventListener('change', updateDefaultsCount);
}

function getCheckedDefaults() {
  return Array.from($('defaultsBody').querySelectorAll('input[type=checkbox]:checked'))
              .map(cb => cb.value);
}

function updateDefaultsCount() {
  const ids = getCheckedDefaults();
  $('defaultsCount').textContent = `${ids.length} / ${defaultsList.length} 项`;
  const btn = $('applyDefaultsBtn');
  if (btn) btn.disabled = !sessionId || ids.length === 0;
}

function toggleAllDefaults(check) {
  $('defaultsBody').querySelectorAll('input[type=checkbox]').forEach(cb => {
    cb.checked = check;
  });
  updateDefaultsCount();
}

async function applyDefaults() {

  const btn = $('applyDefaultsBtn');

function syncBatchDefaultsCount() {

function formatSize(bytes) {
  if (bytes < 1024) return bytes + ' B';
  if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
  return (bytes / (1024 * 1024)).toFixed(2) + ' MB';
}

function renderBatchFiles() {
  const list = $('batchFileList');
  if (batchFiles.length === 0) {
    list.innerHTML = '';
    return;
  }
  list.innerHTML = batchFiles.map((bf, i) => `
    <div class="batch-file-row">
      <span class="name">${escapeHtml(bf.file.name)}</span>
      <span class="size">${formatSize(bf.file.size)}</span>
      <button class="remove" data-i="${i}" title="移除">×</button>
    </div>
  `).join('');
  list.querySelectorAll('.remove').forEach(btn => {
    btn.addEventListener('click', () => {
      batchFiles.splice(parseInt(btn.dataset.i), 1);
      renderBatchFiles();
      syncBatchStartBtn();
    });
  });
}

function addBatchFiles(fileList) {
  for (const f of fileList) {
    if (!f.name.toLowerCase().endsWith('.docx')) continue;
    // 去重：同名同大小视为重复
    if (batchFiles.some(b => b.file.name === f.name && b.file.size === f.size)) continue;
    batchFiles.push({ file: f });
  }
  renderBatchFiles();
  syncBatchStartBtn();
}

  $('batchResults').hidden = true;
  $('batchResults').innerHTML = '';
  renderBatchFiles();
  syncBatchStartBtn();
});

async function runBatch() {
  const useDefaults = $('batchUseDefaults').checked;
  const ids = (useDefaults && typeof getCheckedDefaults === 'function')
              ? getCheckedDefaults() : [];
  const msg = $('batchMessage').value.trim();
  if (batchFiles.length === 0) return;
  if (ids.length === 0 && !msg) {
    alert(useDefaults
      ? '请先在左侧勾选默认排版功能，或填写附加指令'
      : '已取消应用默认排版功能 — 请填写附加指令以指定要执行的操作');
    return;
  }

  const startBtn = $('batchStartBtn');
  startBtn.disabled = true;
  startBtn.textContent = '处理中…';

  const resultsBox = $('batchResults');
  resultsBox.hidden = false;
  resultsBox.innerHTML = `
    <div class="batch-progress">
      <div class="spinner"></div>
      <span>正在处理 ${batchFiles.length} 个文件…（每份约 1-3 秒，如含 LLM 解析会更慢）</span>
    </div>`;

  const fd = new FormData();
  for (const bf of batchFiles) fd.append('files', bf.file, bf.file.name);
  fd.append('feature_ids', JSON.stringify(ids));
  fd.append('message', msg);

  try {
    const r = await fetch('/batch', { method: 'POST', body: fd });
    if (!r.ok) throw new Error(await r.text());
    const data = await r.json();

    let html = `
      <div class="batch-section-title">
        处理结果：成功 ${data.success_count} / 失败 ${data.fail_count}
      </div>`;
    for (const res of data.results) {
      const okClass = res.status === 'ok' ? 'ok' : 'err';
      const icon    = res.status === 'ok' ? '✓' : '×';
      const meta    = res.status === 'ok'
                     ? `${res.ops_count} ops${res.title_used ? ' · 题目: ' + escapeHtml(res.title_used) : ''}`
                     : '';
      html += `
        <div class="batch-result-row ${okClass}">
          <span class="icon">${icon}</span>
          <span class="name">${escapeHtml(res.filename)}</span>
          <span class="meta">${meta}</span>
          ${res.status !== 'ok' ? `<div class="err-msg">${escapeHtml(res.error || '')}</div>` : ''}
        </div>`;
    }
    if (data.download_url) {
      html += `
        <div style="margin-top:12px; text-align:center;">
          <a class="btn btn-primary" href="${data.download_url}"
             style="text-decoration:none;" download>
            下载结果 (zip)
          </a>
        </div>`;
    }
    resultsBox.innerHTML = html;
  } catch (err) {
    resultsBox.innerHTML =
      `<div style="color:#b83c2a; padding:12px; font-size:12.5px;">
         批量处理失败：${escapeHtml(err.message)}
       </div>`;
  } finally {
    startBtn.textContent = '开始批量处理';
    startBtn.disabled = false;
  }
}

$('batchStartBtn').addEventListener('click', runBatch);

// ===== 预览 =====

let previewBusy = false;

async function refreshPreview() {
  if (!sessionId || previewBusy) return;
  previewBusy = true;
  setPreviewStatus('渲染中…');

  const container = $('previewContainer');
  container.innerHTML =
    '<div class="preview-loading"><div class="spinner"></div><span>正在渲染文档…</span></div>';

  try {
    const resp = await fetch(`/download/${sessionId}`, { cache: 'no-store' });
    if (!resp.ok) throw new Error(`获取文档失败 (${resp.status})`);
    const buf = await resp.arrayBuffer();

    container.innerHTML = '';

    if (typeof docx === 'undefined' || typeof docx.renderAsync !== 'function') {
      throw new Error('docx-preview 库未正确加载，请检查网络后刷新页面');
    }

    await docx.renderAsync(buf, container, null, {
      className: 'docx',
      inWrapper: true,
      ignoreWidth: false,
      ignoreHeight: false,
      breakPages: true,
      ignoreFonts: false,
      trimXmlDeclaration: true,
      useBase64URL: true,
    });

    const t = new Date().toLocaleTimeString('zh-CN',
      { hour: '2-digit', minute: '2-digit', second: '2-digit' });
    setPreviewStatus(`已更新 ${t}`);
  } catch (err) {
    container.innerHTML =
      `<div class="preview-loading err">⚠ 渲染失败：${err.message}</div>`;
    setPreviewStatus('渲染失败');
  } finally {
    previewBusy = false;
  }
}

$('previewRefreshBtn').addEventListener('click', refreshPreview);
</script>
</body>
</html>
